<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#09141f"/>
    </linearGradient>

    <!-- Gold Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Emerald Emblem Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Terminal Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Inner Subtle Vignette -->
  <rect x="18" y="18" width="476" height="476" rx="112" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>

  <!-- Protective Anti-Fraud Shield (Background of Logo) -->
  <path d="M256 95 L385 140 C385 270 295 365 256 395 C217 365 127 270 127 140 Z" 
        fill="#022c22" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" opacity="0.95"/>
  <path d="M256 115 L365 152 C365 258 290 340 256 368 C222 340 147 258 147 152 Z" 
        fill="#064e3b" stroke="#10b981" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>

  <!-- Group: Main Monogram "K" + Smart Terminal -->
  <g id="kassaEmblem" transform="translate(10, 0)">
    <!-- Stylized Letter "K" - Vertical Stem -->
    <path d="M165 185 L205 185 L205 345 L165 345 Z" 
          fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Stylized Letter "K" - Diagonal Upper Arm -->
    <path d="M195 260 L275 185 L320 185 L230 270 Z" 
          fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Smart POS Terminal (Acts as the Diagonal Lower Arm of "K") -->
    <g transform="rotate(12 280 280)">
      <!-- Terminal Base / Body -->
      <rect x="235" y="175" width="115" height="175" rx="18" 
            fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8"/>
      
      <!-- Terminal Display Screen -->
      <rect x="248" y="190" width="89" height="80" rx="8" 
            fill="url(#screenGrad)" stroke="#34d399" stroke-width="2"/>
      
      <!-- Verified / Anti-Fraud Checkmark on Screen -->
      <path d="M268 230 L285 248 L320 210" 
            fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Keypad Dots / Buttons -->
      <circle cx="265" cy="290" r="5" fill="url(#goldGrad)"/>
      <circle cx="292" cy="290" r="5" fill="url(#goldGrad)"/>
      <circle cx="320" cy="290" r="5" fill="url(#goldGrad)"/>
      <circle cx="265" cy="308" r="5" fill="#34d399"/>
      <circle cx="292" cy="308" r="5" fill="#34d399"/>
      <circle cx="320" cy="308" r="5" fill="#34d399"/>
      <rect x="260" y="325" width="65" height="7" rx="3.5" fill="url(#goldGrad)"/>
      
      <!-- Top Thermal Receipt Slot -->
      <rect x="260" y="165" width="65" height="12" rx="3" fill="#e2e8f0"/>
      <line x1="268" y1="171" x2="317" y2="171" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- Fresh Market Leaf Accent on Top of Terminal -->
    <path d="M345 130 C380 135 395 165 375 190 C360 165 340 155 345 130 Z" 
          fill="#34d399" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M370 155 C395 155 405 180 390 198 C375 180 365 170 370 155 Z" 
          fill="#10b981" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Bottom Brand Text Accent: KASSA POS -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="44" font-weight="900" letter-spacing="6" fill="url(#goldGrad)">KASSA POS</text>
  <text x="256" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="16" font-weight="700" letter-spacing="3" fill="#34d399">SMART PASAR SYSTEM</text>
</svg>
